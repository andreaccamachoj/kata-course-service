server:
  port: 8080
spring:
  application:
    name: "course"
  devtools:
    add-properties: false
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 2000MB
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  datasource:
    url: "${URL_DB:jdbc:postgresql://localhost:5432/course}"
    username: "${USERNAME_DB:postgres}"
    password: "${PASSWORD_DB:root}"
    driverClassName: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddlAuto: "update"
    showSql: "true"
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "{ALLOWED_CORS_ORIGIN:http://localhost:4200,http://localhost:8080}"
adapter:
  aws:
    s3:
      bucketName: "${BUCKET_NAME:coursefileslearningacademykatabb}"
      region: "${AWS_REGION:us-east-1}"